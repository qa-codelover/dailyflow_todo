<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="container">
    <header>
        <h1>DAY FLOW</h1>
        <p>YOUR DAILY PLANNER</p>
        <h2>MY DAILY ROUTINE 
            <span><i class="fa-solid fa-ranking-star"></i></span>
        </h2>
        <h4>Organize your day, one task at a time.</h4>
        <h6>Friday · Make today count!</h6>
    </header>
    <section id="add_task">
        <h3>Add new task</h3>
        <form id="task_form" action="">

            <input id="task_name" type="text" placeholder="What do you need to do today" required>
            <input id="task_time" type="time" placeholder="choose time" required>
            <button type="submit" id="add_btn">Add task</button>
        </form>
    </section>
    <section id="progress">
        <h3>TODAY'S PROGRESS</h3>
        <p id="progress_text">2 of 5 completed</p>
        <div id="progress_bar">
            <div id="fill_progress"></div>
        </div>
    </section>
    <section id="today_task">
        <h3>TODAY'S TASKS</h3>
        <button id="all_tasks">All tasks</button>
        <button id="pending_tasks">pending</button>
        <button id="complete_tasks">completed</button>
        <div id="card">
            <input id="task_complete" type="checkbox">
            <p id="task_type">morning walk</p>
            <input id="time" type="time">
            <button id="edit_task">Edit <span><i class="fa-regular fa-pen-to-square"></i></span></button>
            <button id="delete_task">delete <span><i class="fa-solid fa-trash-can"></i></span></button>
        </div>
    </section>
</div>

    <script src="script.js"></script>
</body>
</html>
